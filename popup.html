<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schema DevTools</title>
  <style>
    body {
      font: 12px/1.4 system-ui, sans-serif;
      margin: 0;
      padding: 12px 14px;
      width: 260px;
      color: #1e1e1e;
    }
    h1 { font-size: 13px; margin: 0 0 6px; }
    p { margin: 0 0 8px; color: #5c5c5c; }
    kbd {
      font: 11px ui-monospace, monospace;
      background: #f3f3f3;
      border: 1px solid #d4d4d4;
      border-radius: 3px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <h1>Schema DevTools</h1>
  <p>Open DevTools (<kbd>F12</kbd> or <kbd>⌥⌘I</kbd>), then select the <strong>Schema</strong> tab.</p>
  <p>In <strong>Elements</strong>, the Schema sidebar inspects the selected node.</p>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Interconnected Semantic Linked-Data Diamond Lines (#3b82f6) -->
  <g stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round">
    <line x1="64" y1="20" x2="20" y2="64" />
    <line x1="64" y1="20" x2="108" y2="64" />
    <line x1="20" y1="64" x2="64" y2="108" />
    <line x1="108" y1="64" x2="64" y2="108" />
  </g>

  <!-- 4-Point Search Spark (Exact Same Blue as Lines: #3b82f6) -->
  <path d="M 64 22 Q 64 64 106 64 Q 64 64 64 106 Q 64 64 22 64 Q 64 64 64 22 Z" fill="#3b82f6" />
  
  <!-- Inner Diamond Facet (Deeper Blue Accent #2563eb) -->
  <polygon points="64,42 86,64 64,86 42,64" fill="#2563eb" />

  <!-- Center White Star Core -->
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" />

  <!-- 4 Semantic Flat Graph Nodes -->
  <!-- Top Node: Google Blue #1a73e8 -->
  <circle cx="64" cy="20" r="9" fill="#1a73e8" />
  <circle cx="64" cy="20" r="4" fill="#ffffff" />

  <!-- Left Node: Electric Cyan #00b4d8 -->
  <circle cx="20" cy="64" r="9" fill="#00b4d8" />
  <circle cx="20" cy="64" r="4" fill="#ffffff" />

  <!-- Right Node: Emerald Green #22c55e -->
  <circle cx="108" cy="64" r="9" fill="#22c55e" />
  <circle cx="108" cy="64" r="4" fill="#ffffff" />

  <!-- Bottom Node: Indigo #6366f1 -->
  <circle cx="64" cy="108" r="9" fill="#6366f1" />
  <circle cx="64" cy="108" r="4" fill="#ffffff" />
</svg>
